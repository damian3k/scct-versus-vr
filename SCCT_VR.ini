; SCCT Versus VR - configuration. See USER_GUIDE.md for controls and installation.
[VR]
; 0 = load nothing, game runs exactly as without the mod
Enabled=1

; 0 = automatic: WinlatorXR's XR API when the game runs in a WinlatorXR container on a
; standalone headset (Quest), otherwise OpenXR on the PC. 1 = always OpenXR, 2 = always XR API.
Backend=0
; XR API only: roll (degrees) of the controller orientation WinlatorXR reports compared to an
; OpenXR aim pose. If the gun in your hand is upside down, try 0.
XrApiControllerRoll=180
; XR API only: 1 = stereo 3D (each game frame renders one eye in turn), 0 = mono (each game frame
; goes to both eyes: no depth, but twice the image rate per eye and no time offset between eyes).
XrApiStereo=1

; Unreal units per real-world meter (head movement and eye distance scale).
; Increase if the world feels too small, decrease if it feels too big.
WorldScale=100.0

; 1 = mouse only turns left/right, the headset controls up/down and tilt (recommended).
; 0 = mouse pitch is added on top of head tracking.
IgnoreGamePitch=1

; World up axis: 0=X 1=Y 2=Z (Unreal is Z-up)
WorldUpAxis=2

; Re-project World*View*Projection matrices that the game sends to vertex shaders.
; Turn off if some objects look broken/jumping in VR, and report it.
FixShaderMatrices=1
ShaderMatrixTolerance=0.02

; Keep projected lights (merc flashlight, light/shadow projectors) fixed to the world in VR.
FixProjectedLights=1

; Merc motion vision: the box that highlights a moving object is placed by the game on its own
; flat screen; it is moved to where the object is in each eye. ScreenBoxDistance = distance
; (meters) assumed for the highlighted object (nearer / farther objects get a small offset).
ReprojectScreenBoxes=1
ScreenBoxDistance=6

; Only apply the VR camera to render targets with the backbuffer size
; (keeps shadow maps / reflections / camera gadgets using the game camera).
RequireMainRenderTarget=1

; Virtual-key code for recenter (0x24 = Home)
RecenterKey=0x24

; Virtual screen used for menus and loading screens (meters)
MenuQuadDistance=3.0
MenuQuadWidth=3.2

; HUD, menus and on-screen markers are drawn on their own panel.
; With HudScale=1 the panel covers exactly the game camera's field of view, so markers
; (distances, objectives, player names) line up with the world. Smaller = more compact HUD,
; but markers stop lining up.
HudLayer=1
; Distance of the HUD panel (meters).
HudDistance=2.5
HudScale=0.55
; Aim mode: 1 = HUD follows the game camera / where the weapon aims (objective markers line up
; with the world), 0 = HUD stays in front of your body (markers drift off their targets)
HudFollowAim=1
; Insert (0x2D) switches between the two HUD modes in game
HudToggleKey=0x2D
; Panel size in the follow-the-weapon mode (1.0 = the game's whole field of view).
; Adjust in game with Num+ / Num- until objective markers sit on their targets
; (the value is written to SCCT_VR.log).
HudFollowScale=0.45

; ---- Controllers ----
; AimMode=2 (auto): the right controller aims only while a first-person weapon is on screen
;   (merc); otherwise (spy, third person) the right stick moves the camera like a mouse.
; AimMode=1: always aim with the controller. AimMode=0: never.
; AimToggleKey (0x23 = End) or the AimToggle binding switches it off/on in game.
AimMode=2
; Extra laser beam from the right controller while aiming (off: the merc's own laser is enough)
Laser=0
LaserLength=15
LaserWidth=0.004
; Menus: steer the cursor with the controller ray (experimental, off: use the right stick)
MenuLaser=0
; How many 3D draws make a frame "gameplay" (fewer = shown as a flat menu screen)
MinSceneDraws=10
AimToggleKey=0x23
; Distance (m) along the controller ray where the game's aim converges
AimConvergence=10.0
; How quickly the game camera follows the controller (0.2 - 1.0)
AimGain=0.5
; Mouse counts per degree of game camera rotation; 0 = learn automatically
MouseCountsPerDegree=0
MousePitchScale=1.0
; First-person weapon (merc) is moved into the right hand in aim mode.
; WeaponOffset = grip point of the weapon relative to the game camera (Unreal units: right, up, forward).
; Tune these if the gun sits too far / too low in your hand. WeaponPitch tilts it (degrees).
WeaponInHand=1
WeaponRadius=120
WeaponOffsetX=10
WeaponOffsetY=-15
WeaponOffsetZ=20
WeaponPitch=0

; Smooth turn speed (deg/s); SnapTurn > 0 switches to snap turning by that many degrees
TurnSpeed=120
SnapTurn=0
; Right stick as mouse (counts per second): in game (spy camera / aim mode off) and in menus
StickMouseSpeed=4500
MenuMouseSpeed=1500

; Merc zoom (binoculars / sniper mode of the Assault Gun): bring your eyes down to the weapon
; (right controller close to your head, pointing where you look) and the zoom key ([Bindings]
; ScopeKey, B in the stock layout) is pressed; lift your head and it is pressed again.
; Right stick up/down zooms in/out (mouse wheel). ScopeGestureDistance = eyes-to-controller
; distance in meters that starts the zoom.
ScopeGesture=1
ScopeGestureDistance=0.22
; While the game is zoomed its own flat image (zoom overlay, HUD) is shown on a screen in front
; of your eyes. ScopeMaxFov = game FOV (degrees) below which the zoom starts (normal merc
; view is ~111, zoomed ~40-55),
; ScopeDistance in meters, ScopeSize = screen size relative to the game's normal view.
ScopeView=1
ScopeMaxFov=70
ScopeDistance=1.0
ScopeSize=0.8
; Zoomed, the controller moves the game's crosshair like a mouse. Higher = the crosshair moves
; further for the same hand motion.
ScopeMouseScale=1.0
; Spy binoculars (B) use the same gesture; while looking through them you look around with
; your head.

; Merc reload: bring your left hand to the magazine of the gun in your right hand (in front of
; and below the right controller) and the reload key ([Bindings] ReloadKey, R by default) is
; pressed, like changing the magazine by hand. Pull the hand away before the next reload.
; ReloadForward / ReloadDown = where the magazine is relative to the right controller (meters),
; ReloadRadius = how close the left hand has to get. The distance is written to SCCT_VR.log.
ReloadGesture=1
ReloadForward=0.10
ReloadDown=0.07
ReloadRadius=0.10

; Spy (third person): 1 = the right controller's rotation steers the camera and aims a drawn
; weapon (its position is ignored), the right stick turns you; 0 = the right stick moves the
; camera like a mouse (old mode).
SpyAim=1
; Keep the VR view still behind the spy while the controller turns the game camera (the game's
; camera orbits around the spy; the mod finds the spy's model and places the view relative to it).
SpyStableCamera=1
; Spy first-person view: click both sticks together to switch (third person <-> the spy's eyes).
; The view is attached to the top of the spy's head (follows crouching, climbing...). Eye
; position relative to it (Unreal units: right, up, forward). Using the binoculars once measures
; it automatically (written to SCCT_VR.log - copy the values here to keep them).
; SpyFpvHideRadius: objects whose origin is this close to the spy are its own gear (goggles...)
; and are not drawn in first person. SpyFpvShowBody=1 keeps the body (you see your hands and
; arms), 0 hides it too.
SpyEyeRight=0
SpyEyeUp=-8
SpyEyeForward=16
SpyFpvHideRadius=60
SpyFpvShowBody=1

; PC window during gameplay (for streaming / people watching), the right eye cropped to the
; window's proportions:
;   2 = like in the headset: the HUD where you see it in VR (the crosshair follows the gun)
;   1 = the HUD over the whole window (crosshair in the middle)
;   0 = the raw headset frames (eyes alternate, no HUD)
DesktopMirror=2

; Diagnostics (Pause key writes one frame's draw calls to SCCT_VR_frame.txt;
; one frame is also dumped automatically ~20 s into gameplay)
D3D12DebugLayer=0
StatsIntervalSec=10
; Diagnostics: write a frame dump every N seconds of gameplay (SCCT_VR_frame_auto1..20.txt), 0 = off
DumpEverySec=0

; Controller -> key bindings (Quest/Touch layout). Values: a letter/digit, F1-F12, Space, Shift,
; Ctrl, Alt, Tab, Esc, Enter, Backspace, Home, End, PgUp, PgDn, Up, Down, Left, Right,
; LMB, RMB, MMB, WheelUp, WheelDown, 0x?? (virtual key), AimToggle, Recenter, or empty.
[Bindings]
RightTrigger=LMB
LeftTrigger=RMB
RightGrip=Shift
LeftGrip=Q
A=Space
B=C
X=R
Y=Tab
LeftStickClick=MMB
RightStickClick=E
Menu=Esc
LeftStickUp=W
LeftStickDown=S
LeftStickLeft=A
LeftStickRight=D
RightStickUp=WheelUp
RightStickDown=WheelDown
; Hold bindings: holding a control for ~0.35 s sends "<Name>Hold" instead (a quick press still
; sends the normal binding). Y: tap = vision modes, hold = co-op move (T).
YHold=T
; Key the zoom gesture presses (the game's zoom / binocular toggle)
ScopeKey=B
; Key the reload gesture presses
ReloadKey=R

; Used while playing the Spy (no controller aiming): the right stick moves the camera, so
; gadgets move to X - tap = next gadget, hold = previous gadget. Controls not listed here keep
; their [Bindings] value (hold bindings work the same way: <Name>Hold).
[SpyBindings]
X=WheelDown
XHold=WheelUp

; Used while a menu is on screen (main menu, match menus, in-game menu). Controls not listed
; here keep their [Bindings] value.
[MenuBindings]
LeftStickUp=Up
LeftStickDown=Down
LeftStickLeft=Left
LeftStickRight=Right
A=Enter
B=Esc
